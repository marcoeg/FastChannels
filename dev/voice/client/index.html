<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minny</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:1.5rem;
         background:#0b0e14; color:#d8dee9;
         font:16px/1.5 system-ui, sans-serif; }
  h1 { font-size:1.3rem; font-weight:600; margin:0; letter-spacing:.04em; }
  #orb { width:110px; height:110px; border-radius:50%;
         background:radial-gradient(circle at 35% 30%, #3b4b6b, #141a26);
         border:2px solid #2b3950; transition:box-shadow .2s, transform .2s; }
  #orb.listening { box-shadow:0 0 40px 6px #3fbf7f66; }
  #orb.speaking  { box-shadow:0 0 40px 8px #6f9dff88; transform:scale(1.05); }
  #status { min-height:1.5em; opacity:.8; }
  button { padding:.7rem 2rem; border-radius:.6rem; border:1px solid #33415e;
           background:#1a2233; color:#d8dee9; font-size:1rem; cursor:pointer; }
  button:hover { background:#223049; }
  #pair { margin-top:1rem; text-align:center; }
  #pair summary { cursor:pointer; opacity:.7; }
  #pair form { display:flex; gap:.5rem; justify-content:center; margin-top:.8rem; }
  #pair input { width:8.5rem; padding:.6rem; border-radius:.6rem; border:1px solid #33415e;
                background:#0f1420; color:#d8dee9; font-size:1.1rem; letter-spacing:.15em; text-align:center; }
  #pair button { padding:.6rem 1.2rem; }
  #pairStatus { min-height:1.5em; margin-top:.5rem; opacity:.8; }
</style>
</head>
<body>
<h1>MINNY</h1>
<div id="orb"></div>
<div id="status">disconnected</div>
<button id="btn">Connect</button>
<details id="pair" hidden>
  <summary>Pair a TV</summary>
  <form id="pairForm">
    <input id="pairCode" inputmode="numeric" autocomplete="off" placeholder="123 456" aria-label="Code on the TV's Minny screen">
    <button type="submit">Pair</button>
  </form>
  <div id="pairStatus">Open the viewer's Minny screen and type its code.</div>
</details>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.6.2/dist/livekit-client.umd.min.js"></script>
<script src="config.js"></script>
<script>
const { Room, RoomEvent, Track } = LivekitClient;
const orb = document.getElementById('orb');
const status = document.getElementById('status');
const btn = document.getElementById('btn');
let room = null;

function setStatus(t) { status.textContent = t; }

// ?test → room "test-plan": the agent's test mode (traces marked "test",
// a separate memory graph, no mixing with real sessions).
const TEST = new URLSearchParams(location.search).has('test');
if (TEST) {
  const b = document.createElement('div');
  b.textContent = 'TEST MODE — room test-plan';
  b.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:6px;text-align:center;' +
                    'background:#b45309;color:#fff;font:600 14px system-ui;z-index:10';
  document.body.appendChild(b);
}

// Pairing (VOICE_TV=minny): the code the viewer shows on its Minny screen
// is claimed on the remote relay through caddy (/api/pair/claim). Once per
// viewer: the relay keeps the pairing, the viewer keeps its token.
if (window.VOICE_CONFIG.pairing) {
  const pair = document.getElementById('pair');
  const pairStatus = document.getElementById('pairStatus');
  const code = document.getElementById('pairCode');
  pair.hidden = false;
  document.getElementById('pairForm').onsubmit = async (e) => {
    e.preventDefault();
    const digits = code.value.replace(/\D/g, '');
    if (digits.length !== 6) { pairStatus.textContent = 'The code has 6 digits.'; return; }
    pairStatus.textContent = 'pairing…';
    try {
      const res = await fetch('/api/pair/claim', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code: digits }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) {
        pairStatus.textContent = 'Paired: ' + (body.name || body.device_id) + '. It will follow your voice commands.';
        code.value = '';
      } else if (res.status === 404) {
        pairStatus.textContent = 'No TV is showing that code (codes last 10 minutes).';
      } else if (res.status === 401) {
        pairStatus.textContent = 'The remote relay refused the claim (it expects a controller token).';
      } else {
        pairStatus.textContent = 'The remote relay is not reachable (' + res.status + ').';
      }
    } catch (err) {
      pairStatus.textContent = 'failed: ' + err.message;
    }
  };
}

btn.onclick = async () => {
  if (room) { await room.disconnect(); return; }
  const url = window.VOICE_CONFIG.url.replace('{HOST}', location.hostname);
  const token = TEST ? window.VOICE_CONFIG.testToken : window.VOICE_CONFIG.token;
  if (TEST && !token) { setStatus('no test token — re-run mint_token.py'); return; }
  room = new Room();

  room.on(RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === Track.Kind.Audio) {
      const el = track.attach();
      document.body.appendChild(el);
    }
  });
  room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
    const agentSpeaking = speakers.some(p => p !== room.localParticipant);
    const meSpeaking = speakers.some(p => p === room.localParticipant);
    orb.className = agentSpeaking ? 'speaking' : (meSpeaking ? 'listening' : '');
  });
  room.on(RoomEvent.Disconnected, () => {
    room = null; btn.textContent = 'Connect'; orb.className = '';
    setStatus('disconnected');
  });

  try {
    setStatus('connecting…');
    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);
    btn.textContent = 'Disconnect';
    setStatus('connected — just talk');
  } catch (e) {
    setStatus('failed: ' + e.message);
    room = null;
  }
};
</script>
</body>
</html>
