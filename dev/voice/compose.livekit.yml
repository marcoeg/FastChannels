# LiveKit voice stack for Hermes — see dev/hermes/VOICE.md and the design in
# dev/EPG-GRAPH-PLAN.md's sibling plan. Host networking on purpose: WebRTC
# ICE candidates must advertise the host's LAN address, and caddy proxies the
# signal WebSocket over TLS for browser mic access.
#
#   cd /home/marco/Development/FastChannels/dev/voice
#   sg docker -c "docker compose -f compose.livekit.yml -p hermes-voice up -d"
#
# Ports on the host:
#   8443/tcp  caddy  — HTTPS client page + wss signal proxy (browsers)
#   7880/tcp  livekit signal (plain ws; used by the local worker only)
#   7881/tcp  livekit RTC over TCP (fallback)
#   7882/udp  livekit RTC media
#
# Secrets live in ./livekit.yaml and ./.env (git-excluded).

name: hermes-voice

services:

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ca:/certs:ro
      - ./client:/srv:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Voice-agent long-term memory (graphiti graph "voice_memory").
  # Unlike the EPG FalkorDB, this data is NOT regenerable: AOF is on and the
  # weekly voice-memory-backup timer copies dump.rdb to ~/backups.
  # Bridge network + loopback publish (the worker connects from the host);
  # same engine digest pin as the EPG stack (compose.epg.yml).
  falkordb-voice:
    image: falkordb/falkordb@sha256:ad09d5051bbda1cfee8cef9d7f41ffe1bcb1c5327b82c442c989e84ab8cc33d3
    restart: unless-stopped
    environment:
      FALKORDB_PASSWORD: ${VOICE_FALKORDB_PASSWORD}
      REDIS_ARGS: >-
        --requirepass ${VOICE_FALKORDB_PASSWORD}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy noeviction
      # Memory queries are tiny — a low default catches engine wedges fast
      # (deliberately NOT the EPG stack's 15000/60000 ingest tuning).
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 5000 TIMEOUT_MAX 30000"
      # FalkorDB Browser for inspecting Minny's memory graph. Loopback only.
      # It connects server-side from INSIDE this container, so log in with
      # host localhost, port 6379, empty username, VOICE_FALKORDB_PASSWORD.
      BROWSER: "1"
    volumes:
      - falkordb_voice_data:/var/lib/falkordb/data
    ports:
      - "127.0.0.1:6390:6379"
      - "127.0.0.1:3002:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$FALKORDB_PASSWORD" -p 6379 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  falkordb_voice_data:
